services:
  redis:
    # Redis persists BullMQ jobs so phase3 can resume queued work after restarts.
    image: redis:7-alpine
    container_name: transcriptions-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data

volumes:
  redisdata:
